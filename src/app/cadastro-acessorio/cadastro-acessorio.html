<app-menu />

<main class="content">
  <section class="form-container">
    <h1>Cadastro de acessório</h1>
    <p>Informe o nome do acessório</p>

    <form (ngSubmit)="enviarFormulario()">
      <label for="nome">nome do acessório:</label>
      <input type="text" id="nome" name="nome" [(ngModel)]="nome" maxlength="50" required>

      @if (erro) {
        <p class="erro" role="alert">{{ erro }}</p>
      }

      @if (sucesso) {
        <p class="sucesso" role="status">{{ sucesso }}</p>
      }

      <button type="submit">Cadastrar acessório</button>
    </form>
  </section>

  <section class="lista-container">
    <h2>Acessórios cadastrados</h2>
    @if (acessorios.length === 0) {
      <p class="vazio">Nenhum acessório cadastrado.</p>
    } @else {
      <ul class="lista-simples">
        @for (a of acessorios; track a.id_acessorio) {
          <li>{{ a.nome }}</li>
        }
      </ul>
    }
  </section>
</main>
