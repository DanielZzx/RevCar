<header class="topo">
 <a class="logo" routerLink="/">
  <img src="images/logo.png" alt="RevCar">
</a>
</header>


<div class="content">

    <div class="form-container">

  <h1>Cadastre sua conta</h1>
  <p>Preencha os dados abaixo</p>

  <form (ngSubmit)="enviarFormulario()">
    <label for="login">login:</label>
    <input type="text" id="login" name="login"
           [(ngModel)]="login" required>

    <label for="password">password:</label>
    <input type="password" id="password" name="password"
           [(ngModel)]="password" minlength="5" required>
    <small class="dica-senha">mínimo de 5 caracteres</small>

    <label for="confirmPassword">confirmar password:</label>
    <input type="password" id="confirmPassword" name="confirmPassword"
           [(ngModel)]="confirmPassword" required>

    @if (erro) {
      <p class="erro">{{ erro }}</p>
    }

    <button type="submit">Cadastrar</button>
  </form>

  <p>Já possui uma conta?</p>

  <button type="button" (click)="voltarLogin()">Voltar para o login</button>
</div>

</div>
