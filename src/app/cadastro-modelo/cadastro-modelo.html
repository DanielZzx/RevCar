<app-menu />

<div class="content">
  <div class="form-container">
    <h1>Cadastro de modelo</h1>
    <p>Informe o modelo e a marca a que ele pertence</p>

    <form (ngSubmit)="enviarFormulario()">
      <label for="id_marca">marca:</label>
      <select id="id_marca" name="id_marca"
              [(ngModel)]="id_marca" required>
        <option [ngValue]="null" disabled>Selecione a marca</option>
        @for (marca of marcas; track marca.id_marca) {
          <option [ngValue]="marca.id_marca">{{ marca.nome }}</option>
        }
      </select>

      @if (marcas.length === 0) {
        <p class="dica">Nenhuma marca cadastrada ainda. Cadastre uma marca primeiro.</p>
      }

      <label for="nome">nome do modelo:</label>
      <input type="text" id="nome" name="nome"
             [(ngModel)]="nome" maxlength="50" required>

      @if (erro) {
        <p class="erro" role="alert">{{ erro }}</p>
      }

      @if (sucesso) {
        <p class="sucesso" role="status">{{ sucesso }}</p>
      }

      <button type="submit">Cadastrar modelo</button>
    </form>

    <p>Precisa de uma marca nova ou quer ver as marcas e modelos cadastrados?</p>

    <button type="button" (click)="irParaMarca()">Marcas e modelos cadastrados</button>
  </div>
</div>
